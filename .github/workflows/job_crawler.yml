name: Israeli Tech Job Crawler

on:
  schedule:
    # Fast scan (no headless browser): every hour at :30, 07:30-22:30 Israel time
    - cron: '30 5-20 * * *'
    # Full scan (also JS-heavy career sites): 3 times a day, ~08:00 / 14:00 / 19:00 Israel time
    - cron: '0 6,12,17 * * *'
  workflow_dispatch: # Allows manual run at any time from GitHub UI

permissions:
  contents: write

concurrency:
  group: job-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SCAN_MODE: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6,12,17 * * *') && 'full' || 'fast' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node (for Claude Code CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install headless browser (full scans only)
        if: env.SCAN_MODE == 'full'
        run: playwright install --with-deps chromium

      - name: Run Job Crawler
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-flash-latest"
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL: "sonnet"
          CANDIDATE_PROFILE: ${{ secrets.CANDIDATE_PROFILE }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python job_crawler.py

      - name: Commit and Push Updated Seen Jobs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          for f in seen_jobs.json state.json evaluated_jobs.json evaluations_log.jsonl feedback.jsonl pending_notifications.json; do [ -f "$f" ] && git add "$f"; done
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update seen jobs database [skip ci]" && git pull --rebase origin main && git push origin main)

      - name: Upload Daily Excel Report
        uses: actions/upload-artifact@v4
        if: always() && env.SCAN_MODE == 'full'
        with:
          name: daily-jobs-excel
          path: new_jobs_*.xlsx
          retention-days: 14